# =====================================================================
#  Скилл статей - конфиг проекта Life in AlexMotion
#  Собран автопилотом 2026-09-22 по разведке репозитория + интервью.
#
#  ВАЖНО - соглашения этого проекта:
#  1. Все пути ниже - ОТ КОРНЯ ПРОЕКТА. Инструменты запускать из корня:
#       py statejnik/tools/<script>.py ...
#     Конфиг находится автоматически (_config.py ищет ./config.yaml, потом
#     statejnik/tools/config.yaml, потом statejnik/config.yaml).
#  2. Python не в PATH - вызывать через лаунчер `py` (3.14.4).
#  3. Обязательна переменная PYTHONIOENCODING=utf-8, иначе скрипты падают
#     с UnicodeEncodeError на консоли cp1251:
#       PYTHONIOENCODING=utf-8 py statejnik/tools/ai-cadence-check.py ...
#  4. PyYAML не установлен - работает мини-парсер из tools/_config.py.
#     Поэтому НЕ использовать блочные скаляры (`>`, `|`): только строки
#     в кавычках и списки.
# =====================================================================

project:
  # Сайта у проекта нет. Контент - Telegram-канал, публикация через бота
  # (Cloudflare Worker + Bot API). Поэтому «домен» = адрес канала.
  domain: "t.me/Life_in_AlexMotion"
  # Раздел статей = сам канал. Внутренние ссылки строятся как
  # t.me/Life_in_AlexMotion/<message_id>.
  content_path: "/Life_in_AlexMotion"

audience:
  profile: "Русскоязычные 25-40 лет: знакомые бегуны-любители и кроссфитеры, коллеги-инженеры со стройки АЭС «Эль-Дабаа», экспаты в Египте и друзья из России. Знают, что такое темп, PR, WOD. Не любят инфостиль, отличают реальный опыт от переписанного. Хотят честную фактуру: как реально прошёл старт, что не получилось, как устроена система изнутри."
  # high - читатель свой, спортивную и инженерную терминологию не разжёвывать.
  jargon_level: "high"

voice:
  # Корпус реальных текстов автора: 26 постов, 5056 слов.
  # Состав и правила пополнения - в content/README.md (лежит РЯДОМ с папкой,
  # а не внутри: --baseline-dir читает все .md подряд).
  # Корпус принадлежит проекту, а не скиллу: от него зависит сборка Worker
  # (scripts/gen-voice-examples.mjs), поэтому он живёт в content/posts/.
  # Гайд стиля (не образец!) - voice.md в корне; рантайм-копия - src/voice.ts.
  source: "./content/posts"
  # Фразы, которые звучат НЕ по-авторски. Перенесены из стоп-листа voice.md.
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "прокачай себя"
    - "выйди из зоны комфорта"
    - "ты сможешь"
    - "преодолел себя"
    - "не сдался"
    - "несмотря на боль"
    - "в данной статье"
    - "стоит отметить"
    - "таким образом"
    - "новый старт, новые шансы"
    - "Взгляд вперёд:"
    - "Итог:"

cta:
  # уточнить: коммерческого оффера пока нет (монетизация в спеке вынесена
  # за MVP, до 1000+ подписчиков). Дефолт - подписка на сам канал.
  # ВНИМАНИЕ: voice.md запрещает коучинговые призывы, поэтому три CTA-блока
  # из Этапа 5 в этом проекте деградируют до подписи «Train. Think. Explore.».
  offer: "Подписка на Telegram-канал Life in AlexMotion"
  url: "https://t.me/Life_in_AlexMotion"

editorial:
  # Жёсткие формальные табу проекта, проверяются grep на Этапах 8 и 14.
  # Тональные запреты - выше, в voice.forbidden.
  # Плюс запрет хэштегов: grep по "#" даёт ложные срабатывания на заголовках
  # markdown, поэтому хэштеги проверяются глазами.
  banned_words:
    - "—"
    - "–"
    - "@Life_in_AlexMotion"
    - "ё"

legal:
  # Весь контент и аудитория русскоязычные - юр-модуль checklists/legal-ru.md включён.
  region: "ru"

notify:
  channel: "chat"

research:
  youtube:
    # Канал построен на личном опыте, разбор чужих роликов не нужен.
    enabled: false
    transcript_provider: ""
  # уточнить: темы приходят из личных событий и inbox бота, а не из поисковых слотов.
  daily_balance: []
  # уточнить: ландшафт ниши для Этапа 1 (чтобы не свалиться в моно-тему).
  watchlist:
    core:
      - "бег и забеги в Египте"
      - "кроссфит и Спартакиада проекта"
      - "сноуборд"
      - "Strava и трекинг тренировок"
    adjacent:
      - "жизнь экспата в Египте"
      - "стройка АЭС Эль-Дабаа"
      - "Telegram-боты и автоматизация"
      - "инженерный подход к привычкам"
    comparison: []
  windows_days: 14

qa:
  final_review:
    # Модель другого семейства для независимой финальной редактуры.
    # Канал вызова: statejnik/tools/cf-ai.py (REST к Workers AI; биндинг AI
    # доступен только изнутри Worker, снаружи только HTTP). Учётные данные
    # CF_ACCOUNT_ID и CF_API_TOKEN лежат в .dev.vars (он в .gitignore).
    #   PYTHONIOENCODING=utf-8 py statejnik/tools/cf-ai.py --check
    #   PYTHONIOENCODING=utf-8 py statejnik/tools/cf-ai.py --system <промпт-редактора> --user <draft.md>
    # Проверено 2026-09-22: редактор ловит тире и «ё», отчёт по контракту.
    editor_model: "@cf/openai/gpt-oss-120b"
    # Проверяющий - свежий субагент основной модели, без истории автора.
    reviewer_model: ""

cms:
  # Агент кладёт готовый файл в published/, владелец публикует сам через
  # /draft + /publish бота. Инвариант проекта «в канал ничего не уходит
  # без явной команды» сохраняется.
  adapter: "manual"

tools:
  originality:
    # Скрипт берёт корпус позиционным аргументом, не из конфига.
    # Этот ключ - подсказка агенту, какой путь передавать:
    #   py statejnik/tools/originality-check.py <draft.md> content/posts
    # Корпус = content/posts (34 реальных поста). Прежние content/real-posts.md
    # и example-posts.md удалены 2026-09-22: их содержимое целиком дублировалось
    # в корпусе, а код генерации их не читал.
    # После первых публикаций добавить в корпус statejnik/published/.
    # Исторические посты канала лежат в D1 (таблица posts), не в файлах.
    corpus: "content/posts"
    max_cosine: 0.60
    ngram_n: 5
    max_ngram: 0.30
  cadence:
    # Откалибровано по content/posts (34 поста, 6948 слов): плотность
    # 2.91 маркера на 1k, разброс по постам 0.00-14.49. Порог взят с запасом:
    # антитеза «не X, а Y» - родная авторская конструкция (9 вхождений,
    # в том числе в эталоне 26_dr.md), и жать по сумме значит ловить его
    # собственный голос.
    # ГЛАВНЫЙ сигнал - не сумма, а четыре категории, которых у автора НЕТ
    # ни одной: канцелярит, безличное/крючки, литобороты, одиночные слова
    # через точку. Любое ненулевое значение там = переписать, независимо
    # от порога. Смотреть вывод --json покатегорийно, не только вердикт.
    # Пересчёт после пополнения корпуса:
    #   PYTHONIOENCODING=utf-8 py statejnik/tools/ai-cadence-check.py --baseline-dir content/posts
    max_per_1k: 8.0
  read_aloud:
    # У автора средняя длина предложения 8.8 слова (замер по корпусу
    # content/posts: 757 предложений, максимум по файлу 11.1).
    # 25 - потолок, выше которого фраза точно звучит не по-авторски.
    max_sentence_words: 25
  structure:
    # В Telegram нет раздела статей с перелинковкой - требование снято.
    min_internal_links: 0

image:
  # Обложки не генерируем: фото в постах - реальные, приходят в inbox бота
  # как file_id. Этап 6b идёт в SKIP.
  tool: ""
  format: "webp"
  dest: "./statejnik/images"
  ratio: "16:9"
  max_kb: 200
